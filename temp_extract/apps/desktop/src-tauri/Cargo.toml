[package]
name = "ultron-desktop"
version = "0.1.0"
description = "ULTRON desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "ultron_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
